name: Sync Yatra Streamers Roster

on:
  schedule:
    # 7:30 PM IST (14:00 UTC) - Evening stream wave
    - cron: '0 14 * * *'
    # 9:30 PM IST (16:00 UTC) - Prime-time wave
    - cron: '0 16 * * *'
    # 11:30 PM IST (18:00 UTC) - Late-night roleplay peak
    - cron: '0 18 * * *'
    # 1:30 AM IST (20:00 UTC) - Post-midnight stream wave
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-streamers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl Kick and Discover Yatra Streamers
        id: sync
        run: node scripts/sync-yatra-streamers.mjs

      - name: Commit and Push if New Streamers Discovered
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yatra-streamers.json
          git commit -m "chore(roster): auto-discover and add new Yatra streamers"
          git push
