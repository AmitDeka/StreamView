name: Sync Yatra Streamers Roster

on:
  schedule:
    # 6:30 PM IST (13:00 UTC) - First wave (streamers starting between 6:00 PM - 6:30 PM)
    - cron: '0 13 * * *'
    # 7:30 PM IST (14:00 UTC) - Evening wave (streamers starting around 7:00 PM)
    - cron: '0 14 * * *'
    # 9:30 PM IST (16:00 UTC) - Prime-time wave (streamers starting between 9:00 PM - 10:00 PM)
    - cron: '0 16 * * *'
    # 12:00 AM IST (18:30 UTC) - Late-night roleplay peak
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-streamers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl Kick and Discover Yatra Streamers
        id: sync
        run: node scripts/sync-yatra-streamers.mjs

      - name: Commit and Push if New Streamers Discovered
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yatra-streamers.json
          git commit -m "chore(roster): auto-discover and add new Yatra streamers"
          git push
