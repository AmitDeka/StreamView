name: Sync Yatra Streamers Roster

on:
  schedule:
    # 7:35 PM IST (14:05 UTC) - Evening stream wave (bypasses top-of-hour queue)
    - cron: '5 14 * * *'
    # 9:35 PM IST (16:05 UTC) - Prime-time wave
    - cron: '5 16 * * *'
    # 11:35 PM IST (18:05 UTC) - Late-night roleplay peak
    - cron: '5 18 * * *'
    # 1:35 AM IST (20:05 UTC) - Post-midnight stream wave
    - cron: '5 20 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-streamers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl Kick and Discover Yatra Streamers
        id: sync
        env:
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: node scripts/sync-yatra-streamers.mjs

      - name: Commit and Push if New Streamers Discovered
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yatra-streamers.json
          git commit -m "chore(roster): auto-discover and add new Yatra streamers"
          git pull --rebase origin main
          git push origin main
